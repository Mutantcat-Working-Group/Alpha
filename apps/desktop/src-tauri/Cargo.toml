[package]
name = "alpha-desktop"
version = "1.0.20260925"
description = "Tauri shell for the Alpha desktop editor"
authors = ["Mutantcat Working Group"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "alpha_desktop_lib"
path = "src/lib.rs"

[[bin]]
name = "alpha-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
