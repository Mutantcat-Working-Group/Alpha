name: Release app

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag that receives the artifacts. Defaults to the ref name.
        required: false
        type: string

permissions:
  contents: write

concurrency:
  # Attaching artifacts to a release is one publication transaction, so a re-run
  # must replace a half-uploaded set instead of racing a superseded attempt.
  group: release-app-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

env:
  PRIMARY_NODE_VERSION: '24'
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    # One target builds the whole monorepo, packages three interpreter
    # distributions, and compiles the Rust shell. The budget bounds a hung
    # build instead of holding the release open for the runner's allowance.
    timeout-minutes: 90
    env:
      # Hosted runners carry no signing identity. Auto-discovery would fail the
      # build before the ad-hoc identity is ever passed to codesign.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64 / NSIS installer
            runner: windows-latest
            target: win-x64
            script: package:ci:tauri:win:x64
            triple: x86_64-pc-windows-msvc
            extension: exe
          - name: macOS arm64 / DMG
            runner: macos-14
            target: mac-arm64
            script: package:ci:tauri:mac:arm64
            triple: aarch64-apple-darwin
            extension: dmg
          # Intel macOS needs its own image: the Tauri shell, the bundled Node
          # sidecar, and the prepared dsh runtime all execute on the build
          # host, so x64 cannot be produced by an arm64 runner.
          - name: macOS x64 / DMG
            runner: macos-15-intel
            target: mac-x64
            script: package:ci:tauri:mac:x64
            triple: x86_64-apple-darwin
            extension: dmg
          - name: Linux x64 / AppImage
            runner: ubuntu-24.04
            target: linux-x64
            script: package:ci:tauri:linux:x64
            triple: x86_64-unknown-linux-gnu
            extension: AppImage
          - name: Linux arm64 / AppImage
            runner: ubuntu-24.04-arm
            target: linux-arm64
            script: package:ci:tauri:linux:arm64
            triple: aarch64-unknown-linux-gnu
            extension: AppImage
    steps:
      - name: Resolve the release tag
        id: release
        shell: bash
        run: |
          tag="${{ github.event.release.tag_name }}"
          if [ -z "$tag" ]; then tag="${{ inputs.tag }}"; fi
          if [ -z "$tag" ]; then tag="${{ github.ref_name }}"; fi
          if [ -z "$tag" ]; then
            echo "::error::no release tag was published or supplied"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # Credentials stay out of the checkout: the upload step uses the injected
      # token rather than a persisted git credential.
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          clean: true

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          package-manager-cache: false

      - name: Configure pnpm store path
        id: pnpm-store
        shell: bash
        run: |
          store_root="$HOME/.local/share/pnpm/store"
          echo "PNPM_CONFIG_STORE_DIR=$store_root" >> "$GITHUB_ENV"
          store_path=$(PNPM_CONFIG_STORE_DIR="$store_root" pnpm store path --silent)
          echo "path=$store_path" >> "$GITHUB_OUTPUT"

      # Each target downloads its own interpreter wheels and platform packages,
      # so a restored store keeps that off the critical path.
      - uses: actions/cache/restore@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-${{ matrix.target }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # The shell and its Node sidecar are built for one target triple, so the
      # crates and the standard library are compiled for that exact target.
      - name: Add the ${{ matrix.triple }} target
        run: rustup target add ${{ matrix.triple }}

      - name: Install the Linux bundle libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Package ${{ matrix.target }}
        run: pnpm --dir apps/desktop run ${{ matrix.script }}

      - name: Verify the ad-hoc macOS signature
        if: runner.os == 'macOS'
        shell: bash
        run: |
          shopt -s nullglob
          images=(apps/desktop/.desktop-build/targets/${{ matrix.target }}/artifacts/*.${{ matrix.extension }})
          if [ "${#images[@]}" -eq 0 ]; then
            echo "::error::no disk image to verify"
            exit 1
          fi
          codesign --verify --verbose=2 "${images[0]}"

      # Upload the artifact and its .sha256 sidecar from the target's own
      # artifact directory; the packaging script keeps that directory clean.
      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          ARTIFACTS: apps/desktop/.desktop-build/targets/${{ matrix.target }}/artifacts/*
        run: |
          shopt -s nullglob
          files=($ARTIFACTS)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::${{ matrix.target }} produced no artifacts"
            exit 1
          fi
          gh release upload "$TAG" "${files[@]}" --clobber

  checksums:
    name: Generate and upload checksums
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the release tag
        id: release
        shell: bash
        run: |
          tag="${{ github.event.release.tag_name }}"
          if [ -z "$tag" ]; then tag="${{ inputs.tag }}"; fi
          if [ -z "$tag" ]; then tag="${{ github.ref_name }}"; fi
          if [ -z "$tag" ]; then
            echo "::error::no release tag was published or supplied"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download and upload checksums
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # This job never checks the repository out, so gh has no git context
          # to resolve the release against; name it explicitly.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p checksums
          gh release download "$TAG" --pattern '*' --dir checksums --clobber
          cd checksums
          # A re-run would otherwise checksum the previous checksum files.
          rm -f checksums.txt checksums-md5.txt checksums-sha1.txt
          shopt -s nullglob
          files=(*)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::release $TAG has no artifacts to checksum"
            exit 1
          fi
          sha256sum "${files[@]}" > checksums.txt
          md5sum "${files[@]}" > checksums-md5.txt
          sha1sum "${files[@]}" > checksums-sha1.txt
          gh release upload "$TAG" checksums.txt checksums-md5.txt checksums-sha1.txt --clobber

  install-notes:
    name: Install notes
    runs-on: ubuntu-latest
    needs: package
    steps:
      - name: Resolve the release tag
        id: release
        shell: bash
        run: |
          tag="${{ github.event.release.tag_name }}"
          if [ -z "$tag" ]; then tag="${{ inputs.tag }}"; fi
          if [ -z "$tag" ]; then tag="${{ github.ref_name }}"; fi
          if [ -z "$tag" ]; then
            echo "::error::no release tag was published or supplied"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # The release body is authored by the publisher, so the notes are appended
      # once behind a marker instead of replacing what the release already says.
      - name: Append the install notes once
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          body=$(mktemp)
          if ! gh release view "$TAG" --json body --jq '.body // ""' > "$body"; then
            echo "::error::release $TAG was not found"
            exit 1
          fi
          if grep -qF '<!-- alpha-install-notes -->' "$body"; then
            echo "install notes are already part of the release body"
            exit 0
          fi
          version="${TAG#v}"
          {
            echo ""
            sed "s/__VERSION__/$version/g" apps/desktop/install-notes.md
          } >> "$body"
          gh release edit "$TAG" --notes-file "$body"
