name: macOS crash diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  released-app:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Inspect and launch the reported release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: Mutantcat-Working-Group/Alpha
        run: |
          mkdir diagnostic
          gh release download v1.0.20261114 --pattern '*arm64-mac.dmg' --dir diagnostic
          mkdir diagnostic/mount
          hdiutil attach diagnostic/*.dmg -nobrowse -readonly -mountpoint diagnostic/mount
          trap 'hdiutil detach diagnostic/mount >/dev/null || true' EXIT
          cp diagnostic/mount/Alpha.app/Contents/MacOS/alpha-desktop diagnostic/alpha-desktop
          dwarfdump --uuid diagnostic/alpha-desktop
          nm diagnostic/alpha-desktop > diagnostic/symbols.txt 2>&1 || true
          otool -tvV diagnostic/alpha-desktop > diagnostic/disassembly.txt
          python3 - <<'PY'
          import os, signal, subprocess
          process = subprocess.Popen(
              ['diagnostic/mount/Alpha.app/Contents/MacOS/alpha-desktop'],
              start_new_session=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
          try:
              output, _ = process.communicate(timeout=45)
          except subprocess.TimeoutExpired:
              os.killpg(process.pid, signal.SIGTERM)
              output, _ = process.communicate(timeout=20)
          finally:
              try:
                  os.killpg(process.pid, signal.SIGKILL)
              except ProcessLookupError:
                  pass
          print(output.decode(errors='replace'))
          print(f'released app exit status: {process.returncode}')
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: macos-crash-diagnostic
          path: |
            diagnostic/alpha-desktop
            diagnostic/*.txt
