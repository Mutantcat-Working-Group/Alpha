name: Client regressions

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: client-regressions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run affected client and script tests
        run: >-
          pnpm exec vitest run
          packages/client/ui-conversation/tests/input-bar.client.spec.tsx
          packages/client/ui-conversation/tests/keymap-routing.client.spec.tsx
          packages/client/ui-layout/tests
          packages/client/ui-dockkit/tests/components.client.spec.tsx
          packages/client/ui-primitives/tests/atoms.client.spec.tsx
          packages/client/ui-sidebar-files/tests
          packages/client/ui-sidebar-browser/tests
          packages/client/ui-sidebar-documentpreview/tests
          packages/client/ui-schedule/tests/task-manager-page.client.spec.tsx
          packages/client/modules/tests/node-half.client.spec.ts
          scripts/rescope-vendor.spec.ts
      - name: Check client types
        run: pnpm run typecheck
      - name: Build the real Web application
        run: pnpm run build
      - name: Install browser
        run: pnpm --filter @mutantcat/dsh-web-frontend exec playwright install --with-deps chromium
      - name: Exercise contextual editing in the real application
        env:
          DSH_SNAPSHOT: replay
        run: pnpm exec vitest run --config vitest.web.config.ts apps/web/tests/context-menu.e2e.ts
      - name: Upload context menu screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: context-menu-screenshots
          path: .artifacts/context-menu-*.png
          if-no-files-found: ignore

  native-browser:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Stage unused bundle paths for the native test
        run: |
          mkdir -p apps/desktop/src-tauri/bin apps/desktop/src-tauri/staging/runtime
          target=$(rustc -vV | sed -n 's/^host: //p')
          printf 'unused sidecar fixture\n' > "apps/desktop/src-tauri/bin/node-$target"
      - name: Check desktop shell
        working-directory: apps/desktop/src-tauri
        run: cargo check --locked
      - name: Exercise native link and same-document navigation
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked --test browser-webview -- --run
