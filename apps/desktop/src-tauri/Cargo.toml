[package]
name = "alpha-desktop"
version = "1.0.20261110"
description = "Tauri shell for the Alpha desktop editor"
authors = ["Mutantcat Working Group"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "alpha_desktop_lib"
path = "src/lib.rs"

[[bin]]
name = "alpha-desktop"
path = "src/main.rs"

[[test]]
name = "browser-webview"
path = "tests/browser_webview.rs"
harness = false

[features]
# Opt-in build of the throwaway macOS AppKit probe in src/bin/geomprobe.rs.
# Cargo auto-discovers src/bin as bin targets, so the probe has to be excluded
# from the default build: it imports objc2 crates that only macOS links.
geomprobe = []

[[bin]]
name = "geomprobe"
path = "src/bin/geomprobe.rs"
required-features = ["geomprobe"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSWindow", "NSView", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSString"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["WKWebViewConfiguration"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
